<div class="fm-container inner">
  <div class="copy">
    <fm-section-head
      align="start"
      tone="dark"
      eyebrow="Popular routes"
      title="High demand lanes with *active carriers*"
      subtitle="These corridors move daily. Quote one and you will usually hear back within the hour."
      fmReveal
    />

    <ul class="lanes">
      @for (lane of lanes; track lane.from + lane.to; let i = $index) {
        <li [fmReveal]="i" [revealStep]="55">
          <a
            routerLink="/register"
            [queryParams]="{ role: 'shipper', origin: lane.from, destination: lane.to }"
          >
            <span class="lane">
              {{ lane.from }}
              <fm-icon name="arrow-right" size="13" [strokeWidth]="2.2" />
              {{ lane.to }}
            </span>
            <span class="go">
              Get quotes
              <fm-icon name="arrow-right" size="12" [strokeWidth]="2.4" />
            </span>
          </a>
        </li>
      }
    </ul>

    <a class="fm-btn fm-btn--on-dark all" routerLink="/register" fmReveal>
      View all routes
      <fm-icon name="arrow-right" size="14" [strokeWidth]="2.2" />
    </a>
  </div>

  <div class="map" aria-hidden="true">
    <!-- viewBox is padded past the 100x84 coordinate grid so the city labels,
         which sit outside the coastline, are inside the drawn area rather than
         relying on overflow and crowding the container edge. -->
    <svg viewBox="0 -2 118 92" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="fm-land" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
        </linearGradient>

        <linearGradient id="fm-lane" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#f5323b" stop-opacity="0.15" />
          <stop offset="50%" stop-color="#f5323b" stop-opacity="0.95" />
          <stop offset="100%" stop-color="#f5323b" stop-opacity="0.15" />
        </linearGradient>
      </defs>

      <!--
        Stylised Australian coastline plotted from real longitude/latitude on
        the same grid as the city pins (see CITIES in popular-routes.ts), so the
        pins land where they belong rather than being nudged by eye. Simplified
        for legibility at this size — indicative, not a survey.
      -->
      <path
        class="outline"
        d="M72.6 4.1 L74.5 8.0 L79.2 15.6 L80.5 19.0 L82.9 24.7 L88.6 29.0 L91.7 34.6
           L98.1 39.1 L97.6 44.4 L99.0 47.0 L94.8 57.4 L93.3 59.7 L90.2 67.4 L85.7 69.4
           L81.9 72.2 L78.5 69.1 L75.0 71.8 L70.5 70.3 L66.3 66.7 L63.3 62.2 L59.5 63.1
           L61.4 56.6 L57.5 58.0 L56.9 61.7 L51.7 55.4 L45.0 55.5 L38.0 55.0 L32.0 57.5
           L23.6 59.8 L14.0 62.4 L7.4 60.9 L9.3 55.2 L6.2 47.5 L4.0 38.2 L5.0 31.0
           L8.5 29.0 L15.7 27.1 L24.3 21.5 L24.3 17.8 L30.0 19.5 L38.3 15.6 L40.5 14.4
           L44.9 8.3 L48.0 10.5 L51.2 5.3 L55.0 8.5 L59.0 7.7 L57.9 17.0 L65.5 20.9
           L68.6 20.4 L71.2 8.6 Z"
      />
      <!-- Tasmania -->
      <path class="outline" d="M79.5 76.6 L84.4 75.9 L86.1 79.1 L84.0 82.6 L80.4 81.1 Z" />

      @for (lane of lanes; track lane.from + lane.to) {
        <path class="link" [attr.d]="arc(lane)" />
      }

      @for (pin of pins; track pin.name; let i = $index) {
        <circle class="halo" [attr.cx]="pin.x" [attr.cy]="pin.y" r="3.6" [style.--i]="i" />
        <circle class="pin" [attr.cx]="pin.x" [attr.cy]="pin.y" r="1.2" />
        <text
          class="city"
          [class.city--left]="pin.side === 'left'"
          [attr.x]="pin.side === 'left' ? pin.x - 2.8 : pin.x + 2.8"
          [attr.y]="pin.y + 1.1"
        >
          {{ pin.name }}
        </text>
      }
    </svg>
  </div>
</div>
