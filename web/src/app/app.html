<header class="topbar">
  <a class="brand" routerLink="/">FreightMove</a>

  <nav>
    @if (auth.isAuthenticated()) {
      <a [routerLink]="auth.homeRoute()" routerLinkActive="active">Dashboard</a>
      <span class="role-chip">{{ auth.role() }}</span>
      <button type="button" class="link" (click)="signOut()">Sign out</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Sign in</a>
      <a class="button" routerLink="/register">Get started</a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
